name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: echo "y" | sdkmanager "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Download OpenCV Android SDK
        run: |
          wget -q https://github.com/opencv/opencv/releases/download/4.9.0/opencv-4.9.0-android-sdk.zip
          unzip -q opencv-4.9.0-android-sdk.zip -d $HOME
          echo "OPENCV_DIR=$HOME/OpenCV-android-sdk/sdk/native/jni" >> $GITHUB_ENV

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "OPENCV_DIR=${{ env.OPENCV_DIR }}" >> gradle.properties
          echo "ndk.dir=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> local.properties

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hsui-engine-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
